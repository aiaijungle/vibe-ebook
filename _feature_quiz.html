<script>
(function(){
'use strict';
var SB_URL='https://hzobwciaqtbfaxxvcots.supabase.co';
var SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh6b2J3Y2lhcXRiZmF4eHZjb3RzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDcxMjIxNTcsImV4cCI6MjA2MjY5ODE1N30.YXKC3Rv1jqMb-rr8NQ5Hm5wFcFWlKuNZ5F2bStUK_Ro';
var OPTS=['A','B','C','D'];
var _bookId='',_bookTitle='',_nextUrl='',_score=0,_total=0,_readerName='';

function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function formatDate(d){return d.getFullYear()+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+String(d.getDate()).padStart(2,'0')}
function formatDateKo(d){return d.getFullYear()+'년 '+(d.getMonth()+1)+'월 '+d.getDate()+'일'}

function showToast(msg){var t=document.getElementById('eq-toast');if(!t)return;t.textContent=msg;t.classList.add('show');setTimeout(function(){t.classList.remove('show')},2500)}

function closeCert(){var o=document.getElementById('eq-cert-overlay');if(o){o.classList.remove('is-open');document.body.style.overflow=''}}

function populateCert(bookTitle,score,total,name,nextUrl){
  var d=new Date();
  var pct=Math.round(score/total*100);
  // 화면용
  var titleEl=document.getElementById('eq-cert-book-title');
  var nameEl=document.getElementById('eq-cert-reader-name');
  var scoreEl=document.getElementById('eq-cert-score-text');
  var dateEl=document.getElementById('eq-cert-date');
  var nextEl=document.getElementById('eq-cert-next');
  if(titleEl)titleEl.textContent=bookTitle;
  if(nameEl)nameEl.textContent=name;
  if(scoreEl)scoreEl.textContent=total+'문항 중 '+score+'개 정답 ('+pct+'%)';
  if(dateEl)dateEl.textContent=formatDate(d);
  if(nextEl){nextEl.href=nextUrl||'https://aiaijungle.github.io/vibe-ebook/index.html';nextEl.textContent='다음 권 읽기 →'}
  // 인쇄용
  var pcTitle=document.getElementById('pc-title');
  var pcName=document.getElementById('pc-name');
  var pcScore=document.getElementById('pc-score');
  var pcDate=document.getElementById('pc-date');
  if(pcTitle)pcTitle.textContent=bookTitle;
  if(pcName)pcName.textContent=name;
  if(pcScore)pcScore.textContent=total+'문항 중 '+score+'개 정답 ('+pct+'%)';
  if(pcDate)pcDate.textContent=formatDateKo(d);
  // X(트위터) 공유 링크
  var xBtn=document.getElementById('eq-share-x');
  if(xBtn){
    var xText='['+bookTitle+'] 수료! 🎓\n'+score+'/'+total+' 정답 ('+pct+'%)\n\n#AI사냥꾼 #바이브코딩 #AITF';
    xBtn.href='https://twitter.com/intent/tweet?text='+encodeURIComponent(xText)+'&url='+encodeURIComponent('https://aiaijungle.github.io/vibe-ebook/')
  }
}

function openCert(bookTitle,bookId,score,total,name,nextUrl){
  _readerName=name;_score=score;_total=total;_bookTitle=bookTitle;_bookId=bookId;_nextUrl=nextUrl||'';
  populateCert(bookTitle,score,total,name,nextUrl);
  var o=document.getElementById('eq-cert-overlay');
  if(o){o.classList.add('is-open');document.body.style.overflow='hidden'}
  // Supabase 저장
  try{fetch(SB_URL+'/rest/v1/completions',{method:'POST',headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json','Prefer':'return=minimal'},body:JSON.stringify({book_id:bookId,nickname:name,quote:'퀴즈 수료 ('+score+'/'+total+')'})}).catch(function(){})}catch(e){}
  lsSet('eq_cert_'+bookId,'1');
}

// 이벤트 바인딩
document.addEventListener('DOMContentLoaded',function(){
  var closeBtn=document.getElementById('eq-cert-close');
  var overlay=document.getElementById('eq-cert-overlay');
  var kakaoBtn=document.getElementById('eq-share-kakao');
  var pdfBtn=document.getElementById('eq-pdf-btn');

  if(closeBtn)closeBtn.addEventListener('click',closeCert);
  if(overlay)overlay.addEventListener('click',function(e){if(e.target===overlay)closeCert()});
  document.addEventListener('keydown',function(e){if(e.key==='Escape')closeCert()});

  if(kakaoBtn)kakaoBtn.addEventListener('click',function(){
    var pct=Math.round(_score/_total*100);
    var text='['+_bookTitle+'] 수료! 🎓\n'+_score+'/'+_total+' 정답 ('+pct+'%)\n지금 무료로 읽기 → https://aiaijungle.github.io/vibe-ebook/\n\n#AI사냥꾼 #바이브코딩';
    if(navigator.share){
      navigator.share({title:_bookTitle+' 수료 인증',text:text}).catch(function(){});
    } else if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){showToast('카카오톡에 붙여넣기 해서 공유하세요! 📋')}).catch(function(){showToast('복사 실패')});
    } else {
      var ta=document.createElement('textarea');ta.value=text;ta.style.cssText='position:fixed;opacity:0;top:-9999px;';document.body.appendChild(ta);ta.focus();ta.select();
      try{document.execCommand('copy');showToast('카카오톡에 붙여넣기 해서 공유하세요! 📋')}catch(e){showToast('복사 실패')}
      document.body.removeChild(ta);
    }
  });

  if(pdfBtn)pdfBtn.addEventListener('click',function(){
    showToast('인쇄 창에서 "PDF로 저장"을 선택하세요');
    setTimeout(function(){window.print()},400);
  });
});

window.EbookQuiz={
  render:function(containerId,questions,bookTitle,bookId,nextUrl){
    _bookId=bookId;_bookTitle=bookTitle;_nextUrl=nextUrl||'';_total=questions.length;
    var PASS_MIN=Math.ceil(_total*0.8);
    var container=document.getElementById(containerId);
    if(!container)return;

    var html='<div class="eq-wrap">'
      +'<div class="eq-badge">FINAL QUIZ · '+bookTitle+'</div>'
      +'<div class="eq-title">📝 최종 퀴즈</div>'
      +'<div class="eq-desc">'+_total+'문항 중 <strong style="color:#a78bfa;">'+PASS_MIN+'개 이상</strong> 맞히면 수료증을 받습니다.</div>';

    questions.forEach(function(q,qi){
      html+='<div class="eq-question" id="eq-q'+qi+'">'
        +'<div class="eq-qnum">Q'+(qi+1)+' / '+_total+'</div>'
        +'<div class="eq-qtext">'+q.q+'</div>'
        +'<div class="eq-opts">';
      q.opts.forEach(function(opt,oi){
        html+='<button class="eq-opt" data-qi="'+qi+'" data-oi="'+oi+'" type="button">'
          +'<span class="eq-opt-marker">'+OPTS[oi]+'</span><span>'+opt+'</span></button>';
      });
      html+='</div><div class="eq-explain">'+q.explain+'</div></div>';
    });

    html+='<button class="eq-submit" id="eq-submit-btn" disabled>✅ 제출하기</button>'
      +'<div class="eq-result" id="eq-result"></div></div>';
    container.innerHTML=html;

    var selected={};
    container.addEventListener('click',function(e){
      var opt=e.target.closest('.eq-opt');
      if(!opt)return;
      var qi=parseInt(opt.getAttribute('data-qi'),10);
      var oi=parseInt(opt.getAttribute('data-oi'),10);
      var qEl=document.getElementById('eq-q'+qi);
      if(qEl.classList.contains('eq-correct')||qEl.classList.contains('eq-wrong'))return;
      qEl.querySelectorAll('.eq-opt').forEach(function(o){o.classList.remove('eq-selected')});
      opt.classList.add('eq-selected');
      selected[qi]=oi;
      var sb=document.getElementById('eq-submit-btn');
      if(sb)sb.disabled=Object.keys(selected).length<questions.length;
    });

    var sb=document.getElementById('eq-submit-btn');
    if(sb)sb.addEventListener('click',function(){
      sb.disabled=true;
      var score=0;
      questions.forEach(function(q,qi){
        var qEl=document.getElementById('eq-q'+qi);
        var ua=selected[qi];
        var opts=qEl.querySelectorAll('.eq-opt');
        if(ua===q.correct){score++;qEl.classList.add('eq-correct');opts[ua].classList.add('eq-opt-correct');}
        else{qEl.classList.add('eq-wrong');if(ua!==undefined)opts[ua].classList.add('eq-opt-wrong');opts[q.correct].classList.add('eq-opt-correct');}
      });
      _score=score;
      var pass=score>=PASS_MIN;
      var re=document.getElementById('eq-result');
      if(re){
        re.className='eq-result '+(pass?'eq-pass':'eq-fail');
        re.style.display='block';
        var pct=Math.round(score/_total*100);
        if(pass){
          re.innerHTML='<div class="eq-result-emoji">🎉</div>'
            +'<div class="eq-result-title">합격! 수료증을 받으세요</div>'
            +'<div class="eq-result-score">'+_total+'문항 중 <strong>'+score+'개</strong> 정답 ('+pct+'%)</div>'
            +'<input id="eq-name-input" class="eq-name-input" type="text" maxlength="20" placeholder="수료증에 넣을 이름을 입력하세요" />'
            +'<button class="eq-cert-btn" id="eq-get-cert-btn">🎓 수료증 받기</button>';
          document.getElementById('eq-get-cert-btn').addEventListener('click',function(){
            var ni=document.getElementById('eq-name-input');
            var name=(ni&&ni.value.trim())||'독자';
            openCert(bookTitle,bookId,score,_total,name,nextUrl);
          });
        } else {
          re.innerHTML='<div class="eq-result-emoji">😅</div>'
            +'<div class="eq-result-title">아쉬워요! 다시 도전해보세요</div>'
            +'<div class="eq-result-score">'+_total+'문항 중 <strong>'+score+'개</strong> 정답 — 수료 기준: '+PASS_MIN+'개 이상</div>'
            +'<button class="eq-retry-btn" id="eq-retry-btn">🔄 다시 풀기</button>';
          document.getElementById('eq-retry-btn').addEventListener('click',function(){
            EbookQuiz.render(containerId,questions,bookTitle,bookId,nextUrl);
          });
        }
        re.scrollIntoView({behavior:'smooth',block:'nearest'});
      }
    });
  }
};
})();
</script>
